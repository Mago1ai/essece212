<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#24211D" />
      <stop offset="60%" stop-color="#141210" />
      <stop offset="100%" stop-color="#0A0908" />
    </radialGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E8B2" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA7C11" />
      <stop offset="75%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E59B4C" />
      <stop offset="35%" stop-color="#C97828" />
      <stop offset="70%" stop-color="#944B10" />
      <stop offset="100%" stop-color="#5C2E05" />
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.75)" />
      <stop offset="20%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="80%" stop-color="rgba(255,255,255,0.2)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.6)" />
    </linearGradient>
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldCap)" stroke-width="3" stroke-opacity="0.4" />
  <circle cx="256" cy="270" r="160" fill="#D4AF37" opacity="0.08" />

  <!-- Perfume Atomizer Sprayer / Cap Top -->
  <path d="M 232 86 L 280 86 C 286 86 290 90 290 96 L 290 128 L 222 128 L 222 96 C 222 90 226 86 232 86 Z" fill="url(#goldCap)" />
  <path d="M 288 102 L 302 104 L 302 112 L 288 114 Z" fill="url(#goldCap)" />
  <circle cx="324" cy="98" r="4.5" fill="#F9E8B2" opacity="0.9" />
  <circle cx="344" cy="90" r="3" fill="#D4AF37" opacity="0.75" />
  <circle cx="338" cy="112" r="3.5" fill="#E5C158" opacity="0.8" />

  <rect x="214" y="128" width="84" height="20" rx="3" fill="url(#goldCap)" />
  <rect x="220" y="148" width="72" height="14" rx="2" fill="url(#goldCap)" opacity="0.9" />

  <!-- Contact Shadow -->
  <ellipse cx="256" cy="442" rx="118" ry="16" fill="#000000" opacity="0.65" />

  <!-- Glass Outer Shell -->
  <path d="M 218 162 L 294 162 C 304 162 312 170 318 180 L 356 226 C 366 238 372 254 372 270 L 372 400 C 372 422 354 438 332 438 L 180 438 C 158 438 140 422 140 400 L 140 270 C 140 254 146 238 156 226 L 194 180 C 200 170 208 162 218 162 Z" 
        fill="#1E1B17" stroke="url(#glassBorder)" stroke-width="4.5" />

  <!-- Amber Perfume Liquid Core -->
  <path d="M 154 280 C 154 280 200 272 256 272 C 312 272 358 280 358 280 L 358 396 C 358 412 344 424 326 424 L 186 424 C 168 424 154 412 154 396 Z" 
        fill="url(#liquidGrad)" />

  <path d="M 154 280 Q 256 290 358 280" stroke="rgba(255,235,180,0.5)" stroke-width="2.5" fill="none" />
  <line x1="256" y1="162" x2="256" y2="416" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round" />

  <!-- Luxury Gold Label Badge on Bottle -->
  <rect x="184" y="306" width="144" height="88" rx="6" fill="#141210" stroke="url(#goldCap)" stroke-width="2" />
  <text x="256" y="342" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="url(#goldCap)" text-anchor="middle" letter-spacing="3">M</text>
  <line x1="216" y1="352" x2="296" y2="352" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.6" />
  <text x="256" y="366" font-family="'DM Sans', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#F4F0E9" text-anchor="middle" letter-spacing="3">MÁXIMO</text>
  <text x="256" y="378" font-family="'DM Sans', -apple-system, sans-serif" font-size="7.5" font-weight="400" fill="#D4AF37" text-anchor="middle" letter-spacing="2">EAU DE PARFUM</text>

  <!-- Glint -->
  <path d="M 170 195 L 205 162 L 235 162 L 150 265 Z" fill="url(#specularGlint)" />
</svg>
