<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="del-pink-flacon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="40%" stop-color="#FBCFE8"/>
      <stop offset="70%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="del-silver-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="del-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#DB2777" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#del-shadow)">
    <!-- Silver Ball Dome Cap -->
    <circle cx="200" cy="70" r="28" fill="url(#del-silver-cap)" stroke="#64748B" stroke-width="1"/>
    <!-- Silver Collar Ring with Engraved Pattern -->
    <rect x="175" y="95" width="50" height="15" rx="3" fill="url(#del-silver-cap)" stroke="#475569" stroke-width="1"/>
    <!-- Pink Silk Cord Tassels hanging around neck -->
    <path d="M 180 100 Q 155 130, 145 170" fill="none" stroke="#DB2777" stroke-width="2.5"/>
    <ellipse cx="145" cy="175" rx="6" ry="10" fill="#DB2777"/>

    <!-- Powder Pink Royal Sculpted Flacon -->
    <path d="M 125 115 C 145 110, 255 110, 275 115 L 275 410 C 275 430, 260 435, 200 435 C 140 435, 125 430, 125 410 Z" fill="url(#del-pink-flacon)" stroke="#F472B6" stroke-width="2"/>

    <!-- Delicate French Floral Damask Relief Filigree -->
    <g transform="translate(145, 140)" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7">
      <path d="M 15 20 Q 55 10, 55 50 Q 55 90, 15 80"/>
      <path d="M 95 20 Q 55 10, 55 50 Q 55 90, 95 80"/>
      <circle cx="55" cy="50" r="18"/>
      <path d="M 55 35 Q 45 50, 55 65 Q 65 50, 55 35 Z" fill="#FFFFFF" fill-opacity="0.3"/>
    </g>

    <!-- Typography -->
    <text x="200" y="295" font-family="'Cinzel', 'Playfair Display', serif" font-size="20" font-weight="bold" fill="#831843" text-anchor="middle" letter-spacing="4">DELINA</text>
    <text x="200" y="325" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#9D174D" text-anchor="middle" letter-spacing="3">PARFUMS DE MARLY</text>
    <text x="200" y="340" font-family="'Cinzel', serif" font-size="8" fill="#BE185D" text-anchor="middle" letter-spacing="2">PARIS</text>
    <text x="200" y="375" font-family="'Inter', sans-serif" font-size="7" fill="#BE185D" text-anchor="middle" letter-spacing="2">EAU DE PARFUM · 75 ML</text>
  </g>
</svg>
