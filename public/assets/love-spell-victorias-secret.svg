<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="ls-purple-liquid" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="35%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#581C87"/>
    </radialGradient>
    <linearGradient id="ls-gold-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <filter id="ls-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#7E22CE" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#ls-shadow)">
    <!-- Golden Metallic Cap -->
    <rect x="155" y="45" width="90" height="90" rx="6" fill="url(#ls-gold-cap)" stroke="#854D0E" stroke-width="1.5"/>
    <rect x="160" y="130" width="80" height="15" fill="url(#ls-gold-cap)"/>

    <!-- Purple Cherry Blossom Mist Bottle -->
    <rect x="140" y="145" width="120" height="280" rx="14" fill="url(#ls-purple-liquid)" stroke="#9333EA" stroke-width="2"/>

    <!-- Floating Cherry Blossom Petals -->
    <circle cx="160" cy="180" r="4" fill="#F3E8FF" fill-opacity="0.6"/>
    <circle cx="230" cy="200" r="6" fill="#F3E8FF" fill-opacity="0.6"/>
    <circle cx="160" cy="380" r="5" fill="#F3E8FF" fill-opacity="0.6"/>

    <!-- Label Plaque -->
    <rect x="150" y="210" width="100" height="150" rx="6" fill="#3B0764" fill-opacity="0.85" stroke="url(#ls-gold-cap)" stroke-width="1.5"/>

    <!-- Typography -->
    <text x="200" y="245" font-family="'Cinzel', 'Playfair Display', serif" font-size="10" font-weight="bold" fill="#FEF08A" text-anchor="middle" letter-spacing="3">VICTORIA'S SECRET</text>
    <line x1="165" y1="255" x2="235" y2="255" stroke="#EAB308" stroke-width="0.8"/>
    <text x="200" y="285" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">LOVE</text>
    <text x="200" y="308" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SPELL</text>
    <text x="200" y="335" font-family="'Inter', sans-serif" font-size="7" fill="#E9D5FF" text-anchor="middle" letter-spacing="2">FRAGRANCE MIST · 250 ML</text>
  </g>
</svg>
