<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gg-midnight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="30%" stop-color="#1E1B4B"/>
      <stop offset="70%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gg-gold-heel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2921D"/>
      <stop offset="30%" stop-color="#FFF3B0"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C630D"/>
    </linearGradient>
    <filter id="gg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#gg-shadow)">
    <!-- Iconic Carolina Herrera Stiletto Shoe Silhouette -->
    <!-- Front Toe Point -->
    <path d="M 230 90 C 235 150, 240 240, 290 350 C 310 390, 315 425, 270 425 C 230 425, 175 350, 160 270 C 150 200, 150 140, 160 90 Z" fill="url(#gg-midnight)" stroke="#312E81" stroke-width="2"/>

    <!-- Gold Stiletto Heel Pin -->
    <path d="M 160 240 L 175 240 L 155 435 L 145 435 Z" fill="url(#gg-gold-heel)" stroke="#8C630D" stroke-width="1"/>
    <!-- Gold Heel Top Joint -->
    <rect x="155" y="235" width="22" height="12" rx="2" fill="url(#gg-gold-heel)"/>
    <!-- Gold Heel Base Tap -->
    <rect x="142" y="430" width="16" height="8" rx="2" fill="url(#gg-gold-heel)"/>

    <!-- Integrated Spray Top at Collar of the Stiletto -->
    <rect x="180" y="70" width="40" height="22" rx="4" fill="url(#gg-gold-heel)"/>
    <circle cx="200" cy="81" r="3.5" fill="#1C1405"/>

    <!-- Glass Polish Gleam / Refraction -->
    <path d="M 175 110 Q 170 200, 220 320" fill="none" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M 185 110 Q 180 180, 210 260" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Branding Plaque -->
    <text x="210" y="220" font-family="'Cinzel', 'Playfair Display', serif" font-size="14" font-weight="bold" fill="#FDE68A" text-anchor="middle" letter-spacing="3">GOOD GIRL</text>
    <text x="210" y="238" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="2">CAROLINA HERRERA</text>
    <text x="210" y="252" font-family="'Inter', sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle" letter-spacing="1">EAU DE PARFUM · 80 ML</text>
  </g>
</svg>
