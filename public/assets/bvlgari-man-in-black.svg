<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bvg-matte-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="bvg-rose-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="25%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="75%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="bvg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#bvg-shadow)">
    <!-- Top Geometric Rose Gold Dial / Spray Mechanism -->
    <rect x="155" y="55" width="90" height="25" rx="3" fill="url(#bvg-rose-gold)" stroke="#7C2D12" stroke-width="1"/>
    <circle cx="200" cy="67" r="5" fill="#0A0A0A"/>

    <!-- Monolithic Matte Black Shoulders with Rose Gold Insert Plate -->
    <path d="M 120 80 L 280 80 L 280 430 L 120 430 Z" fill="url(#bvg-matte-black)" stroke="#404040" stroke-width="1.5"/>

    <!-- Top Rose Gold Faceplate Band -->
    <rect x="120" y="80" width="160" height="40" fill="url(#bvg-rose-gold)" stroke="#7C2D12" stroke-width="1"/>
    <!-- Sunburst Engraving Lines on Rose Gold Plate -->
    <line x1="130" y1="100" x2="270" y2="100" stroke="#FFF7ED" stroke-width="1" stroke-opacity="0.8"/>

    <!-- BVLGARI Engraved on Plate -->
    <text x="200" y="106" font-family="'Cinzel', 'Playfair Display', serif" font-size="14" font-weight="bold" fill="#431407" text-anchor="middle" letter-spacing="5">BVLGARI</text>

    <!-- Matte Black Monolith Face -->
    <!-- Gold / Rose Gold Typography -->
    <text x="200" y="240" font-family="'Cinzel', 'Playfair Display', serif" font-size="18" font-weight="bold" fill="#FDBA74" text-anchor="middle" letter-spacing="4">MAN</text>
    <text x="200" y="275" font-family="'Cinzel', 'Playfair Display', serif" font-size="14" font-weight="bold" fill="#FDBA74" text-anchor="middle" letter-spacing="3">IN BLACK</text>

    <text x="200" y="325" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#A3A3A3" text-anchor="middle" letter-spacing="3">EAU DE PARFUM</text>
    <text x="200" y="345" font-family="'Inter', sans-serif" font-size="7" fill="#737373" text-anchor="middle" letter-spacing="2">100 ML · 3.4 FL.OZ.</text>

    <!-- Subtle Edge Bevel Highlighting -->
    <line x1="123" y1="125" x2="123" y2="425" stroke="#525252" stroke-width="1.5"/>
    <line x1="277" y1="125" x2="277" y2="425" stroke="#262626" stroke-width="1.5"/>
  </g>
</svg>
