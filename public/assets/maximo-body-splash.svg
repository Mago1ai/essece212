<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 35 140 415" width="100%" height="100%">
  <defs>
    <!-- Background subtle studio glow -->
    <radialGradient id="bs-glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#F5EFE6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8DEC8" stop-opacity="0"/>
    </radialGradient>
    <!-- Liquid Gradient (Soft Blush Pinkish Amber) -->
    <linearGradient id="bs-liquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E898A5" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#FAD4DB" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#F4BAC4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D97A8C" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Glass Highlights -->
    <linearGradient id="bs-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="bs-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B4B"/>
      <stop offset="30%" stop-color="#FDF1B8"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#A57A2B"/>
      <stop offset="100%" stop-color="#E6C875"/>
    </linearGradient>
    <!-- Label Gradient (Ivory Texture) -->
    <linearGradient id="bs-label" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F7F1E6"/>
    </linearGradient>
    <filter id="bs-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#bs-shadow)">
    <!-- Clear Protective Cap (Top) -->
    <rect x="175" y="45" width="50" height="75" rx="5" fill="#FFFFFF" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="178" y="47" width="10" height="71" rx="2" fill="#FFFFFF" fill-opacity="0.5"/>

    <!-- Inner Spray Nozzle -->
    <rect x="188" y="65" width="24" height="42" rx="3" fill="#FFFFFF" stroke="#E0D6C8" stroke-width="1"/>
    <rect x="198" y="72" width="4" height="6" rx="1" fill="#C59B4B"/>

    <!-- Gold Spray Collar -->
    <rect x="168" y="115" width="64" height="50" rx="3" fill="url(#bs-gold)" stroke="#9A7020" stroke-width="0.8"/>
    <!-- Gold ring ribs -->
    <line x1="168" y1="125" x2="232" y2="125" stroke="#FFF7D1" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="168" y1="155" x2="232" y2="155" stroke="#7A5212" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Bottle Body (Cylindrical Glass 100ml) -->
    <!-- Base Glass Container -->
    <rect x="145" y="165" width="110" height="270" rx="12" fill="#FFFFFF" fill-opacity="0.25" stroke="#E5DCCE" stroke-width="1.5"/>
    <!-- Liquid Layer inside -->
    <rect x="148" y="180" width="104" height="248" rx="8" fill="url(#bs-liquid)"/>
    
    <!-- Dip Tube -->
    <line x1="200" y1="165" x2="202" y2="420" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.75"/>
    <line x1="201" y1="165" x2="201" y2="420" stroke="#D97A8C" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Label Background (Cream with Floral Frame) -->
    <rect x="150" y="210" width="100" height="180" rx="4" fill="url(#bs-label)" stroke="#D4AF37" stroke-width="1.2"/>
    <!-- Inner Gold Filigree Frame -->
    <rect x="154" y="214" width="92" height="172" rx="2" fill="none" stroke="#E6C875" stroke-width="0.75" stroke-dasharray="3,1"/>

    <!-- Floral Watercolor Ornaments (Roses & Leaves) -->
    <!-- Top Floral Wreath -->
    <g transform="translate(200, 228) scale(0.65)">
      <circle cx="-25" cy="-2" r="7" fill="#F497A9" opacity="0.85"/>
      <circle cx="-25" cy="-2" r="4" fill="#E26A82" opacity="0.9"/>
      <circle cx="25" cy="-2" r="7" fill="#F497A9" opacity="0.85"/>
      <circle cx="25" cy="-2" r="4" fill="#E26A82" opacity="0.9"/>
      <circle cx="0" cy="-4" r="9" fill="#E8788E" opacity="0.9"/>
      <circle cx="0" cy="-4" r="5" fill="#C94C64" opacity="0.95"/>
      <path d="M-12,-8 Q-16,-14 -10,-14 Q-6,-10 -12,-8" fill="#88A878" opacity="0.8"/>
      <path d="M12,-8 Q16,-14 10,-14 Q6,-10 12,-8" fill="#88A878" opacity="0.8"/>
    </g>

    <!-- Brand & Typography on Label -->
    <text x="200" y="262" font-family="'Cormorant Garamond', 'Alex Brush', cursive, serif" font-size="22" font-style="italic" font-weight="600" fill="#24221F" text-anchor="middle" letter-spacing="1">Máximo</text>
    <text x="200" y="274" font-family="'DM Sans', sans-serif" font-size="6.5" font-weight="500" fill="#7A6F62" text-anchor="middle" letter-spacing="2">EAU DE PARFUM</text>
    
    <line x1="172" y1="284" x2="228" y2="284" stroke="#D4AF37" stroke-width="0.8"/>

    <text x="200" y="306" font-family="'Cormorant Garamond', serif" font-size="14" font-weight="700" fill="#24221F" text-anchor="middle" letter-spacing="3">BODY</text>
    <text x="200" y="322" font-family="'Cormorant Garamond', serif" font-size="14" font-weight="700" fill="#24221F" text-anchor="middle" letter-spacing="3">SPLASH</text>

    <!-- Bottom Floral Garland -->
    <g transform="translate(200, 348) scale(0.55)">
      <circle cx="-20" cy="0" r="6" fill="#F497A9" opacity="0.85"/>
      <circle cx="20" cy="0" r="6" fill="#F497A9" opacity="0.85"/>
      <circle cx="0" cy="2" r="8" fill="#E8788E" opacity="0.9"/>
      <path d="M-10,4 Q-14,8 -8,8 Q-4,6 -10,4" fill="#88A878" opacity="0.8"/>
      <path d="M10,4 Q14,8 8,8 Q4,6 10,4" fill="#88A878" opacity="0.8"/>
    </g>

    <text x="200" y="372" font-family="'DM Sans', sans-serif" font-size="8" font-weight="700" fill="#24221F" text-anchor="middle" letter-spacing="1.5">100 ML</text>

    <!-- Glass Reflection Highlight Sheen -->
    <rect x="148" y="166" width="104" height="268" rx="10" fill="url(#bs-glass)" pointer-events="none"/>
    <path d="M 152 172 L 160 172 L 156 425 L 150 425 Z" fill="#FFFFFF" fill-opacity="0.35"/>
    <path d="M 242 172 L 246 172 L 244 425 L 240 425 Z" fill="#FFFFFF" fill-opacity="0.2"/>
  </g>
</svg>
