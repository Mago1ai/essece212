<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bv-vanilla-liquid" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="35%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </radialGradient>
    <linearGradient id="bv-gold-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <filter id="bv-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#854D0E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#bv-shadow)">
    <!-- Golden Metallic Cap -->
    <rect x="155" y="45" width="90" height="90" rx="6" fill="url(#bv-gold-cap)" stroke="#854D0E" stroke-width="1.5"/>
    <rect x="160" y="130" width="80" height="15" fill="url(#bv-gold-cap)"/>

    <!-- Victoria's Secret Fragrance Mist Flacon -->
    <rect x="140" y="145" width="120" height="280" rx="14" fill="url(#bv-vanilla-liquid)" stroke="#CA8A04" stroke-width="2"/>

    <!-- Black & Gold Label Plaque -->
    <rect x="150" y="210" width="100" height="150" rx="6" fill="#1C1917" fill-opacity="0.85" stroke="url(#bv-gold-cap)" stroke-width="1.5"/>

    <!-- Typography -->
    <text x="200" y="245" font-family="'Cinzel', 'Playfair Display', serif" font-size="10" font-weight="bold" fill="#FDE047" text-anchor="middle" letter-spacing="3">VICTORIA'S SECRET</text>
    <line x1="165" y1="255" x2="235" y2="255" stroke="#EAB308" stroke-width="0.8"/>
    <text x="200" y="285" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">BARE</text>
    <text x="200" y="308" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">VANILLA</text>
    <text x="200" y="335" font-family="'Inter', sans-serif" font-size="7" fill="#FEF08A" text-anchor="middle" letter-spacing="2">FRAGRANCE MIST · 250 ML</text>
  </g>
</svg>
