<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="lveb-pink" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="35%" stop-color="#FECDD3"/>
      <stop offset="70%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </radialGradient>
    <linearGradient id="lveb-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="30%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="lveb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#E11D48" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#lveb-shadow)">
    <!-- Silver Crystal Square Cap -->
    <rect x="175" y="60" width="50" height="35" rx="3" fill="url(#lveb-silver)" stroke="#64748B" stroke-width="1"/>
    
    <!-- Iconic Gauze Winged Ribbon Scarf Tied at Neck -->
    <path d="M 175 95 C 150 90, 130 80, 115 65 C 130 85, 150 95, 175 100 Z" fill="#E2E8F0" fill-opacity="0.85" stroke="#CBD5E1"/>
    <path d="M 225 95 C 250 90, 270 80, 285 65 C 270 85, 250 95, 225 100 Z" fill="#E2E8F0" fill-opacity="0.85" stroke="#CBD5E1"/>
    <rect x="180" y="95" width="40" height="15" fill="url(#lveb-silver)"/>

    <!-- Crystal "Le Sourire de Cristal" Smiling Curve Flacon -->
    <rect x="115" y="115" width="170" height="295" rx="12" fill="#FFFFFF" fill-opacity="0.2" stroke="#FDA4AF" stroke-width="2"/>

    <!-- Sculpted Inner Smiling Liquid Drop -->
    <path d="M 125 130 L 275 130 L 275 320 C 275 360, 230 385, 200 385 C 170 385, 125 360, 125 320 Z" fill="url(#lveb-pink)"/>

    <!-- Heavy Solid Clear Crystal Glass Base with "Crystal Smile" Curve -->
    <path d="M 115 350 Q 200 405, 285 350 L 285 410 L 115 410 Z" fill="#FFFFFF" fill-opacity="0.75" stroke="#FECDD3" stroke-width="1.5"/>

    <!-- Typography -->
    <text x="200" y="215" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="bold" fill="#881337" text-anchor="middle" letter-spacing="2">LA VIE EST BELLE</text>
    <text x="200" y="235" font-family="'Cinzel', serif" font-size="11" font-style="italic" fill="#9F1239" text-anchor="middle" letter-spacing="2">Rose Extraordinaire</text>
    <text x="200" y="260" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#BE123C" text-anchor="middle" letter-spacing="3">LANCÔME</text>
    <text x="200" y="280" font-family="'Inter', sans-serif" font-size="7" fill="#E11D48" text-anchor="middle" letter-spacing="2">PARIS · 100 ML</text>
  </g>
</svg>
