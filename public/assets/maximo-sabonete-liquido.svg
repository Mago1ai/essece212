<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 35 180 415" width="100%" height="100%">
  <defs>
    <!-- Background subtle studio glow -->
    <radialGradient id="sl-glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FAF5EE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EAE3D9" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Pearlescent Shimmering Liquid (Gold-tinted Rose/Champagne) -->
    <linearGradient id="sl-liquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2DEC9" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#FDEFE0" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#F9E2C8" stop-opacity="0.92"/>
      <stop offset="75%" stop-color="#FCEAD6" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#E8C6A5" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="sl-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B4B"/>
      <stop offset="30%" stop-color="#FDF1B8"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#A57A2B"/>
      <stop offset="100%" stop-color="#E6C875"/>
    </linearGradient>

    <!-- Glass Highlights -->
    <linearGradient id="sl-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Label Gradient -->
    <linearGradient id="sl-label" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="100%" stop-color="#F7F1E6"/>
    </linearGradient>

    <filter id="sl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#sl-shadow)">
    <!-- White Luxury Dispenser Pump Head -->
    <path d="M 175 60 C 175 52 182 45 190 45 L 210 45 C 218 45 225 52 225 60 L 225 80 L 175 80 Z" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.2"/>
    <!-- Pump Spout nozzle pointing left -->
    <path d="M 175 62 L 140 68 C 135 69 133 73 135 77 L 142 80 L 175 75 Z" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1.2"/>
    <ellipse cx="136" cy="74" rx="2.5" ry="3.5" fill="#C59B4B"/>

    <!-- Pump Neck Stem -->
    <rect x="193" y="80" width="14" height="28" fill="#FFFFFF" stroke="#E0D6C8" stroke-width="1"/>

    <!-- Shiny Gold Collar Ring -->
    <rect x="165" y="108" width="70" height="42" rx="4" fill="url(#sl-gold)" stroke="#9A7020" stroke-width="0.8"/>
    <line x1="165" y1="118" x2="235" y2="118" stroke="#FFF7D1" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="165" y1="140" x2="235" y2="140" stroke="#7A5212" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Bottle Body (Cylindrical with Rounded Shoulder 190ml) -->
    <!-- Base Glass -->
    <rect x="135" y="150" width="130" height="275" rx="20" fill="#FFFFFF" fill-opacity="0.3" stroke="#E5DCCE" stroke-width="1.5"/>
    <!-- Liquid Layer -->
    <rect x="139" y="165" width="122" height="254" rx="16" fill="url(#sl-liquid)"/>

    <!-- Micro Sparkling Glitter flecks in liquid -->
    <circle cx="160" cy="190" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="230" cy="210" r="1.2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="150" cy="380" r="1.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="240" cy="360" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="170" cy="400" r="1.2" fill="#FFFFFF" opacity="0.7"/>

    <!-- Dip Tube -->
    <line x1="200" y1="150" x2="198" y2="410" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.7"/>
    <line x1="199" y1="150" x2="197" y2="410" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Main Botanical Label -->
    <rect x="142" y="195" width="116" height="195" rx="5" fill="url(#sl-label)" stroke="#D4AF37" stroke-width="1.2"/>
    <rect x="146" y="199" width="108" height="187" rx="3" fill="none" stroke="#E6C875" stroke-width="0.8" stroke-dasharray="3,1.5"/>

    <!-- Top Floral Wreath Ornament -->
    <g transform="translate(200, 214) scale(0.75)">
      <circle cx="-30" cy="0" r="8" fill="#F497A9" opacity="0.85"/>
      <circle cx="-30" cy="0" r="5" fill="#E26A82" opacity="0.9"/>
      <circle cx="30" cy="0" r="8" fill="#F497A9" opacity="0.85"/>
      <circle cx="30" cy="0" r="5" fill="#E26A82" opacity="0.9"/>
      <circle cx="0" cy="-3" r="10" fill="#E8788E" opacity="0.9"/>
      <circle cx="0" cy="-3" r="6" fill="#C94C64" opacity="0.95"/>
      <path d="M-15,-8 Q-20,-14 -12,-15 Q-7,-10 -15,-8" fill="#88A878" opacity="0.85"/>
      <path d="M15,-8 Q20,-14 12,-15 Q7,-10 15,-8" fill="#88A878" opacity="0.85"/>
    </g>

    <!-- Brand Typography -->
    <text x="200" y="252" font-family="'Cormorant Garamond', 'Alex Brush', cursive, serif" font-size="24" font-style="italic" font-weight="600" fill="#24221F" text-anchor="middle" letter-spacing="1">Máximo</text>
    <text x="200" y="265" font-family="'DM Sans', sans-serif" font-size="6.5" font-weight="500" fill="#7A6F62" text-anchor="middle" letter-spacing="2">EAU DE PARFUM</text>

    <line x1="165" y1="274" x2="235" y2="274" stroke="#D4AF37" stroke-width="0.8"/>

    <!-- Product Title -->
    <text x="200" y="296" font-family="'Cormorant Garamond', serif" font-size="14" font-weight="700" fill="#24221F" text-anchor="middle" letter-spacing="2.5">SABONETE</text>
    <text x="200" y="313" font-family="'Cormorant Garamond', serif" font-size="14" font-weight="700" fill="#24221F" text-anchor="middle" letter-spacing="2.5">LÍQUIDO</text>

    <!-- Pill: USO DIÁRIO -->
    <rect x="175" y="323" width="50" height="12" rx="6" fill="#A96227" opacity="0.9"/>
    <text x="200" y="331.5" font-family="'DM Sans', sans-serif" font-size="5.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">USO DIÁRIO</text>

    <!-- Bottom Floral Garland -->
    <g transform="translate(200, 350) scale(0.65)">
      <circle cx="-25" cy="0" r="7" fill="#F497A9" opacity="0.85"/>
      <circle cx="25" cy="0" r="7" fill="#F497A9" opacity="0.85"/>
      <circle cx="0" cy="2" r="9" fill="#E8788E" opacity="0.9"/>
      <path d="M-12,4 Q-16,9 -8,9 Q-3,6 -12,4" fill="#88A878" opacity="0.8"/>
      <path d="M12,4 Q16,9 8,9 Q3,6 12,4" fill="#88A878" opacity="0.8"/>
    </g>

    <text x="200" y="375" font-family="'DM Sans', sans-serif" font-size="8.5" font-weight="700" fill="#24221F" text-anchor="middle" letter-spacing="1.5">190 ML</text>

    <!-- Glass Specular Reflection Highlight Sheen -->
    <rect x="137" y="152" width="126" height="271" rx="18" fill="url(#sl-glass)" pointer-events="none"/>
    <path d="M 143 160 L 152 160 L 147 415 L 140 415 Z" fill="#FFFFFF" fill-opacity="0.4"/>
    <path d="M 257 160 L 261 160 L 259 415 L 255 415 Z" fill="#FFFFFF" fill-opacity="0.25"/>
  </g>
</svg>
