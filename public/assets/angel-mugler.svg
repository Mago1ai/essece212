<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="ang-blue-liquid" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
    <linearGradient id="ang-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="35%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="ang-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#0369A1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#ang-shadow)">
    <!-- Top Chrome Sculpted Spray Cap -->
    <path d="M 185 45 L 215 45 L 210 90 L 190 90 Z" fill="url(#ang-chrome)" stroke="#334155" stroke-width="1"/>
    <circle cx="200" cy="65" r="4" fill="#0C4A6E"/>

    <!-- Asymmetrical 5-Pointed Faceted Celestial Crystal Star Flacon -->
    <!-- Star Path -->
    <path d="M 200 90 L 235 190 L 335 195 L 255 260 L 290 370 L 200 305 L 110 370 L 145 260 L 65 195 L 165 190 Z" fill="url(#ang-blue-liquid)" stroke="#E0F2FE" stroke-width="2.5"/>

    <!-- Facet Refraction Planes -->
    <polygon points="200,90 200,240 235,190" fill="#E0F2FE" fill-opacity="0.6"/>
    <polygon points="235,190 200,240 335,195" fill="#38BDF8" fill-opacity="0.5"/>
    <polygon points="335,195 200,240 255,260" fill="#0284C7" fill-opacity="0.6"/>
    <polygon points="255,260 200,240 290,370" fill="#0369A1" fill-opacity="0.7"/>
    <polygon points="290,370 200,240 200,305" fill="#0C4A6E" fill-opacity="0.6"/>
    <polygon points="200,305 200,240 110,370" fill="#0284C7" fill-opacity="0.5"/>
    <polygon points="110,370 200,240 145,260" fill="#38BDF8" fill-opacity="0.7"/>
    <polygon points="145,260 200,240 65,195" fill="#0369A1" fill-opacity="0.6"/>
    <polygon points="65,195 200,240 165,190" fill="#7DD3FC" fill-opacity="0.5"/>
    <polygon points="165,190 200,240 200,90" fill="#BAE6FD" fill-opacity="0.6"/>

    <!-- Center Sparkling Core -->
    <circle cx="200" cy="240" r="14" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="200" cy="240" r="8" fill="#F0F9FF"/>

    <!-- Branding -->
    <text x="200" y="420" font-family="'Cinzel', 'Playfair Display', serif" font-size="18" font-weight="bold" fill="#0C4A6E" text-anchor="middle" letter-spacing="6">ANGEL</text>
    <text x="200" y="440" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0284C7" text-anchor="middle" letter-spacing="3">MUGLER</text>
  </g>
</svg>
