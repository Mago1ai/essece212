<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="av-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="av-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="30%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="av-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="av-black-leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="av-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#av-shadow)">
    <!-- Cap: Silver Crown with textured base -->
    <path d="M 170 50 L 230 50 L 225 95 L 175 95 Z" fill="url(#av-silver)" stroke="#475569" stroke-width="1"/>
    <rect x="165" y="95" width="70" height="15" rx="3" fill="url(#av-silver)" stroke="#475569" stroke-width="1"/>
    
    <!-- Neck Collar -->
    <rect x="180" y="110" width="40" height="20" fill="url(#av-silver)"/>

    <!-- Heavy Shoulder Crystal Flacon -->
    <path d="M 120 135 C 130 130, 270 130, 280 135 L 280 415 C 280 430, 270 435, 250 435 L 150 435 C 130 435, 120 430, 120 415 Z" fill="#F8FAFC" fill-opacity="0.85" stroke="#94A3B8" stroke-width="2"/>

    <!-- Clear Top Glass Chamber with smoky essence -->
    <path d="M 125 140 L 275 140 L 275 240 L 125 240 Z" fill="#E2E8F0" fill-opacity="0.4"/>
    
    <!-- Heavy Solid Crystal Base -->
    <rect x="125" y="405" width="150" height="25" rx="4" fill="#FFFFFF" fill-opacity="0.75"/>

    <!-- Signature Black Leather Textured Band -->
    <rect x="122" y="240" width="156" height="165" fill="url(#av-black-leather)" stroke="#334155" stroke-width="1.5"/>

    <!-- Silver Embossed Crest & Horseman Silhouette -->
    <circle cx="200" cy="300" r="32" fill="none" stroke="url(#av-silver)" stroke-width="2"/>
    <!-- Horseman icon -->
    <path d="M 188 305 Q 195 288, 205 292 Q 212 295, 215 310 Q 200 312, 188 305 Z" fill="url(#av-silver)"/>
    <circle cx="202" cy="286" r="4" fill="url(#av-silver)"/>
    <!-- Silver Spear -->
    <line x1="184" y1="315" x2="216" y2="280" stroke="url(#av-silver)" stroke-width="2"/>

    <!-- Silver Typography -->
    <text x="200" y="355" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle" letter-spacing="4">AVENTUS</text>
    <text x="200" y="375" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="3">CREED</text>
    <text x="200" y="390" font-family="'Inter', sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle" letter-spacing="2">PARFUM · 100 ML</text>

    <!-- Crystal Shimmer Highlights -->
    <rect x="128" y="140" width="12" height="270" fill="url(#av-glass)"/>
    <rect x="260" y="140" width="12" height="270" fill="url(#av-glass)"/>
  </g>
</svg>
