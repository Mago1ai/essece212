<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vip-rose-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6"/>
      <stop offset="35%" stop-color="#FDA4AF"/>
      <stop offset="70%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="vip-rose-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="60%" stop-color="#FFE4E6"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="vip-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#FB7185" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#vip-shadow)">
    <!-- Metallic Rose Gold Capsule Top Dome -->
    <rect x="140" y="55" width="120" height="110" rx="20" fill="url(#vip-rose-metal)" stroke="#F43F5E" stroke-width="1.5"/>
    <line x1="140" y1="165" x2="260" y2="165" stroke="#BE123C" stroke-width="1"/>

    <!-- Gradient Capsule Glass & Metal Body -->
    <rect x="140" y="165" width="120" height="260" rx="20" fill="url(#vip-rose-grad)" stroke="#FDA4AF" stroke-width="2"/>

    <!-- Typography -->
    <text x="200" y="240" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#9F1239" text-anchor="middle" letter-spacing="2">212</text>
    <text x="200" y="275" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#881337" text-anchor="middle" letter-spacing="4">VIP ROSÉ</text>
    <text x="200" y="305" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#BE123C" text-anchor="middle" letter-spacing="3">EXTRAORDINARY</text>

    <!-- Sub-branding -->
    <text x="200" y="380" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#9F1239" text-anchor="middle" letter-spacing="2">CAROLINA HERRERA</text>
    <text x="200" y="398" font-family="'Inter', sans-serif" font-size="7" fill="#BE123C" text-anchor="middle" letter-spacing="1">EAU DE PARFUM · 80 ML</text>

    <!-- Specular Highlight Curve -->
    <line x1="158" y1="65" x2="158" y2="415" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.8"/>
  </g>
</svg>
