<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="lbom-ruby" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FECDD3"/>
      <stop offset="35%" stop-color="#F43F5E"/>
      <stop offset="70%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <linearGradient id="lbom-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="lbom-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#881337" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#lbom-shadow)">
    <!-- Gold Sculpted Crown Cap -->
    <rect x="180" y="55" width="40" height="30" rx="4" fill="url(#lbom-gold)" stroke="#78350F" stroke-width="1"/>
    
    <!-- Butterfly / Sculpted Wing Silhouette Flacon -->
    <!-- Left Wing -->
    <path d="M 200 90 C 130 80, 80 140, 90 220 C 100 290, 140 330, 200 420 Z" fill="url(#lbom-ruby)" stroke="#FDA4AF" stroke-width="2"/>
    <!-- Right Wing -->
    <path d="M 200 90 C 270 80, 320 140, 310 220 C 300 290, 260 330, 200 420 Z" fill="url(#lbom-ruby)" stroke="#FDA4AF" stroke-width="2"/>
    <!-- Center Core Gem -->
    <ellipse cx="200" cy="240" rx="35" ry="120" fill="url(#lbom-ruby)" stroke="url(#lbom-gold)" stroke-width="2"/>

    <!-- Gold Filigree Outline -->
    <path d="M 200 120 Q 140 180, 130 240 Q 140 300, 200 380 Q 260 300, 270 240 Q 260 180, 200 120 Z" fill="none" stroke="url(#lbom-gold)" stroke-width="1.5"/>

    <!-- Typography -->
    <text x="200" y="235" font-family="'Cinzel', 'Playfair Display', serif" font-size="18" font-weight="bold" fill="#FFF1F2" text-anchor="middle" letter-spacing="4">LA BOMBA</text>
    <text x="200" y="260" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FFE4E6" text-anchor="middle" letter-spacing="2">CAROLINA HERRERA</text>
    <text x="200" y="280" font-family="'Inter', sans-serif" font-size="7" fill="#FECDD3" text-anchor="middle" letter-spacing="2">EAU DE PARFUM · 80 ML</text>
  </g>
</svg>
