<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="sc-pink-liquid" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#FDE8E8"/>
      <stop offset="40%" stop-color="#F472B6"/>
      <stop offset="80%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </radialGradient>
    <linearGradient id="sc-gold-legs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="sc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#BE185D" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#sc-shadow)">
    <!-- Iconic Sculpted Golden Legs Cap in the Air -->
    <g transform="translate(140, 30)">
      <!-- Left Leg with High Heel -->
      <path d="M 45 95 C 40 60, 30 40, 20 15 C 23 10, 32 10, 38 18 C 45 35, 55 55, 60 95 Z" fill="url(#sc-gold-legs)" stroke="#78350F" stroke-width="0.8"/>
      <!-- Right Leg with High Heel Crossing -->
      <path d="M 60 95 C 65 60, 75 35, 95 10 C 100 12, 102 20, 92 28 C 80 45, 70 65, 65 95 Z" fill="url(#sc-gold-legs)" stroke="#78350F" stroke-width="0.8"/>
      <!-- Gold Shoes with Stiletto Heels -->
      <polygon points="18,15 15,10 23,8 26,14" fill="#FEF08A"/>
      <polygon points="95,10 102,6 104,13 97,16" fill="#FEF08A"/>
    </g>

    <!-- Golden Cylindrical Base Ring of the Cap -->
    <rect x="170" y="125" width="60" height="25" rx="3" fill="url(#sc-gold-legs)" stroke="#78350F" stroke-width="1"/>
    <!-- Glass Bottle Neck -->
    <rect x="180" y="150" width="40" height="15" fill="#FFFFFF" fill-opacity="0.5"/>

    <!-- Soft Rounded Cylindrical Glass Flacon -->
    <rect x="135" y="165" width="130" height="235" rx="28" fill="url(#sc-pink-liquid)" stroke="#BE185D" stroke-width="2"/>

    <!-- Thick Clear Crystal Base -->
    <rect x="140" y="375" width="120" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.7"/>

    <!-- Bottle Glass Gleam / Reflections -->
    <path d="M 148 185 Q 148 280, 155 370" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6"/>
    <path d="M 154 185 Q 154 280, 160 370" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.9"/>

    <!-- Typography -->
    <text x="200" y="270" font-family="'Cinzel', 'Playfair Display', serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SCANDAL</text>
    <text x="200" y="295" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FDF2F8" text-anchor="middle" letter-spacing="2">JEAN PAUL GAULTIER</text>
    <text x="200" y="325" font-family="'Inter', sans-serif" font-size="8" fill="#FCE7F3" text-anchor="middle" letter-spacing="2">EAU DE PARFUM · 80 ML</text>
  </g>
</svg>
