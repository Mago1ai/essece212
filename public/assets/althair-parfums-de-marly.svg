<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pdm-amber-matte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="35%" stop-color="#A16207"/>
      <stop offset="70%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="pdm-bronze-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="30%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <filter id="pdm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#pdm-shadow)">
    <!-- Heavy Dome Cap -->
    <path d="M 165 65 C 165 45, 235 45, 235 65 L 235 95 L 165 95 Z" fill="url(#pdm-bronze-cap)" stroke="#78350F" stroke-width="1.5"/>
    <rect x="160" y="95" width="80" height="15" rx="3" fill="url(#pdm-bronze-cap)" stroke="#451A03" stroke-width="1"/>
    <!-- Collar Ring -->
    <rect x="175" y="110" width="50" height="15" fill="url(#pdm-bronze-cap)"/>

    <!-- Parfums de Marly Flacon Body with Sculpted Shoulders -->
    <path d="M 125 125 C 145 120, 255 120, 275 125 L 275 410 C 275 430, 260 435, 200 435 C 140 435, 125 430, 125 410 Z" fill="url(#pdm-amber-matte)" stroke="#B45309" stroke-width="2"/>

    <!-- Royal Horses Crest in Relief -->
    <g transform="translate(155, 155)">
      <!-- Left Rearing Horse -->
      <path d="M 30 50 Q 20 30, 10 35 Q 5 25, 20 20 Q 35 15, 30 40 Z" fill="#D97706" opacity="0.6"/>
      <!-- Right Rearing Horse -->
      <path d="M 60 50 Q 70 30, 80 35 Q 85 25, 70 20 Q 55 15, 60 40 Z" fill="#D97706" opacity="0.6"/>
      <!-- Shield -->
      <path d="M 35 35 L 55 35 L 50 60 L 45 68 L 40 60 Z" fill="none" stroke="#D97706" stroke-width="2" opacity="0.8"/>
      <!-- Year 1743 -->
      <text x="45" y="80" font-family="'Cinzel', serif" font-size="8" fill="#FDE68A" text-anchor="middle" letter-spacing="1">1743</text>
    </g>

    <!-- Silk Cord & Tassel Detail -->
    <path d="M 185 110 Q 170 140, 160 170" fill="none" stroke="#FDE68A" stroke-width="2"/>
    <circle cx="160" cy="172" r="3" fill="#B45309"/>

    <!-- Perfume Name Typography -->
    <text x="200" y="295" font-family="'Cinzel', 'Playfair Display', serif" font-size="18" font-weight="bold" fill="#FEF3C7" text-anchor="middle" letter-spacing="4">ALTHAÏR</text>
    <text x="200" y="325" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#FDE68A" text-anchor="middle" letter-spacing="3">PARFUMS DE MARLY</text>
    <text x="200" y="340" font-family="'Cinzel', serif" font-size="8" fill="#FDE68A" text-anchor="middle" letter-spacing="2">PARIS</text>
    <text x="200" y="380" font-family="'Inter', sans-serif" font-size="7" fill="#FDE68A" text-anchor="middle" letter-spacing="2">EXTRAIT DE PARFUM · 125 ML</text>
  </g>
</svg>
