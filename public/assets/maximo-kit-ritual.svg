<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Background Bokeh Glow -->
    <radialGradient id="kit-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="60%" stop-color="#F3EBE0"/>
      <stop offset="100%" stop-color="#E8DEC8"/>
    </radialGradient>
    <filter id="kit-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Soft Studio Linen with Floral Bokeh -->
  <rect width="500" height="400" rx="12" fill="url(#kit-bg)"/>
  
  <!-- Soft Peony Flowers in background -->
  <g transform="translate(420, 80) scale(0.9)" opacity="0.4">
    <circle cx="0" cy="0" r="45" fill="#F8B6C4"/>
    <circle cx="-10" cy="-10" r="35" fill="#F497A9"/>
    <circle cx="10" cy="10" r="25" fill="#E8788E"/>
  </g>
  <g transform="translate(460, 160) scale(0.7)" opacity="0.35">
    <circle cx="0" cy="0" r="40" fill="#FAD4DB"/>
    <circle cx="5" cy="-5" r="30" fill="#F497A9"/>
  </g>
  <!-- Baby's breath sprigs (left) -->
  <g transform="translate(40, 100)" opacity="0.5">
    <circle cx="10" cy="10" r="3" fill="#FFFFFF"/>
    <circle cx="25" cy="5" r="3.5" fill="#FFFFFF"/>
    <circle cx="18" cy="24" r="3" fill="#FFFFFF"/>
    <circle cx="35" cy="18" r="4" fill="#FFFFFF"/>
    <line x1="0" y1="40" x2="35" y2="10" stroke="#88A878" stroke-width="1.2"/>
  </g>

  <!-- Group of 4 Máximo Products on Table -->
  <g filter="url(#kit-shadow)">
    <!-- 1. Sabonete Líquido 190ml (Far Left) with Pump -->
    <g transform="translate(45, 120)">
      <!-- Pump Nozzle (White/Gold) -->
      <path d="M42,20 L60,16 L60,25 L45,26 Z" fill="#FFFFFF" stroke="#D4AF37" stroke-width="0.8"/>
      <rect x="35" y="24" width="16" height="20" fill="#D4AF37" rx="2"/>
      <rect x="25" y="44" width="36" height="15" fill="#D4AF37" rx="2"/>
      <!-- Bottle Body -->
      <rect x="15" y="58" width="56" height="175" rx="10" fill="#FAF6EE" stroke="#D8CFC0" stroke-width="1"/>
      <rect x="18" y="62" width="50" height="165" rx="8" fill="#F5E3C8" fill-opacity="0.8"/>
      <!-- Label -->
      <rect x="20" y="85" width="46" height="115" rx="3" fill="#FFFDF8" stroke="#D4AF37" stroke-width="0.7"/>
      <text x="43" y="115" font-family="'Cormorant Garamond', cursive, serif" font-size="11" font-style="italic" fill="#24221F" text-anchor="middle">Máximo</text>
      <text x="43" y="132" font-family="'Cormorant Garamond', serif" font-size="7" font-weight="700" fill="#24221F" text-anchor="middle">SABONETE</text>
      <text x="43" y="142" font-family="'Cormorant Garamond', serif" font-size="7" font-weight="700" fill="#24221F" text-anchor="middle">LÍQUIDO</text>
      <text x="43" y="182" font-family="'DM Sans', sans-serif" font-size="6" font-weight="600" fill="#7A6F62" text-anchor="middle">190 ml</text>
    </g>

    <!-- 2. Body Splash 100ml (Center-Left) with Gold Spray -->
    <g transform="translate(145, 95)">
      <!-- Clear Cap -->
      <rect x="30" y="10" width="30" height="48" rx="4" fill="#FFFFFF" fill-opacity="0.5" stroke="#E2D8CA" stroke-width="1"/>
      <!-- Gold Spray Collar -->
      <rect x="24" y="56" width="42" height="32" rx="2" fill="#D4AF37" stroke="#9A7020" stroke-width="0.7"/>
      <!-- Glass Bottle with Pinkish Liquid -->
      <rect x="10" y="88" width="70" height="170" rx="10" fill="#FAF6EE" stroke="#E2D8CA" stroke-width="1"/>
      <rect x="13" y="94" width="64" height="158" rx="8" fill="#FAD4DB" fill-opacity="0.9"/>
      <!-- Dip Tube -->
      <line x1="45" y1="88" x2="45" y2="250" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
      <!-- Label -->
      <rect x="15" y="115" width="60" height="110" rx="3" fill="#FFFDF8" stroke="#D4AF37" stroke-width="0.8"/>
      <text x="45" y="146" font-family="'Cormorant Garamond', cursive, serif" font-size="14" font-style="italic" fill="#24221F" text-anchor="middle">Máximo</text>
      <text x="45" y="172" font-family="'Cormorant Garamond', serif" font-size="9" font-weight="700" fill="#24221F" text-anchor="middle">BODY SPLASH</text>
      <text x="45" y="210" font-family="'DM Sans', sans-serif" font-size="7" font-weight="700" fill="#24221F" text-anchor="middle">100 ML</text>
    </g>

    <!-- 3. Creme Acetinado 200g (Center-Right Jar) -->
    <g transform="translate(240, 160)">
      <!-- White Lid -->
      <rect x="0" y="0" width="130" height="30" rx="5" fill="#FFFFFF" stroke="#D8CFC0" stroke-width="1"/>
      <!-- Jar Body -->
      <rect x="5" y="28" width="120" height="108" rx="8" fill="#FAF8F5" stroke="#D8CFC0" stroke-width="1"/>
      <!-- Floral Label -->
      <rect x="10" y="42" width="110" height="80" rx="3" fill="#FFFDF8" stroke="#D4AF37" stroke-width="0.8"/>
      <text x="65" y="76" font-family="'Cormorant Garamond', cursive, serif" font-size="18" font-style="italic" fill="#24221F" text-anchor="middle">Máximo</text>
      <text x="65" y="96" font-family="'Cormorant Garamond', cursive, serif" font-size="12" font-style="italic" fill="#A96227" text-anchor="middle">Creme Acetinado</text>
      <text x="65" y="112" font-family="'DM Sans', sans-serif" font-size="7" font-weight="700" fill="#24221F" text-anchor="middle">200g</text>
    </g>

    <!-- 4. Perfume Capilar 45ml/60ml (Far Right) -->
    <g transform="translate(390, 145)">
      <!-- Clear Cap -->
      <rect x="18" y="0" width="24" height="42" rx="3" fill="#FFFFFF" fill-opacity="0.5" stroke="#E2D8CA" stroke-width="0.8"/>
      <!-- White Pump -->
      <rect x="15" y="40" width="30" height="22" rx="2" fill="#FFFFFF" stroke="#DCD3C5" stroke-width="0.8"/>
      <!-- Glass Bottle -->
      <rect x="8" y="62" width="44" height="150" rx="7" fill="#FAF6EE" stroke="#E2D8CA" stroke-width="0.9"/>
      <rect x="10" y="68" width="40" height="138" rx="5" fill="#FAE8BE" fill-opacity="0.85"/>
      <!-- Label -->
      <rect x="12" y="90" width="36" height="98" rx="2" fill="#FFFDF8" stroke="#D4AF37" stroke-width="0.6"/>
      <text x="30" y="116" font-family="'Cormorant Garamond', cursive, serif" font-size="9" font-style="italic" fill="#24221F" text-anchor="middle">MÁXIMO</text>
      <text x="30" y="136" font-family="'DM Sans', sans-serif" font-size="5" font-weight="700" fill="#24221F" text-anchor="middle">PERFUME</text>
      <text x="30" y="144" font-family="'DM Sans', sans-serif" font-size="5" font-weight="700" fill="#24221F" text-anchor="middle">CABELO</text>
      <text x="30" y="174" font-family="'DM Sans', sans-serif" font-size="5.5" font-weight="600" fill="#7A6F62" text-anchor="middle">45ml</text>
    </g>
  </g>
</svg>
