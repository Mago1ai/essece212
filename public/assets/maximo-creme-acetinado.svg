<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 150 265 230" width="100%" height="100%">
  <defs>
    <!-- Jar Body Gradient (Porcelain White with Soft Shadows) -->
    <linearGradient id="jar-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8E2D8"/>
      <stop offset="15%" stop-color="#FAF8F5"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="90%" stop-color="#F2EDE4"/>
      <stop offset="100%" stop-color="#DDD6C8"/>
    </linearGradient>
    <!-- Lid Gradient (Glossy White with Subtle Pearl) -->
    <linearGradient id="jar-lid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFD8CC"/>
      <stop offset="12%" stop-color="#FDFCFB"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#D5CDBD"/>
    </linearGradient>
    <!-- Gold Metallic Foil Gradient -->
    <linearGradient id="jar-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B4B"/>
      <stop offset="25%" stop-color="#FDF1B8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#B88A35"/>
      <stop offset="100%" stop-color="#E8CF82"/>
    </linearGradient>
    <!-- Label Background Texture -->
    <linearGradient id="jar-label" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="50%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F7F1E6"/>
    </linearGradient>
    <filter id="jar-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#jar-shadow)">
    <!-- Red Silk Rose decorative accent on the side (from photo) -->
    <g transform="translate(75, 330) scale(0.75)" opacity="0.95">
      <circle cx="0" cy="0" r="38" fill="#8B0E20"/>
      <path d="M-28,-15 C-20,-35 20,-35 28,-15 C35,10 15,35 -5,35 C-25,35 -35,10 -28,-15 Z" fill="#B3132B"/>
      <path d="M-20,-8 C-12,-25 15,-25 20,-8 C25,10 10,25 -2,25 C-15,25 -25,10 -20,-8 Z" fill="#D62240"/>
      <circle cx="0" cy="0" r="14" fill="#990F24"/>
      <circle cx="0" cy="0" r="8" fill="#6E0514"/>
    </g>

    <!-- White Cosmetic Jar Lid (200g wide lid) -->
    <rect x="110" y="160" width="180" height="42" rx="7" fill="url(#jar-lid)" stroke="#D8CFC0" stroke-width="1.2"/>
    <line x1="110" y1="195" x2="290" y2="195" stroke="#C4B9A6" stroke-width="1.2"/>
    <path d="M 115 163 L 130 163 L 126 198 L 113 198 Z" fill="#FFFFFF" fill-opacity="0.6"/>

    <!-- Jar Main Body (Wide Cylindrical White Container) -->
    <rect x="115" y="200" width="170" height="155" rx="10" fill="url(#jar-body)" stroke="#D8CFC0" stroke-width="1.2"/>

    <!-- Label Wrap (Floral Máximo Label) -->
    <rect x="120" y="220" width="160" height="118" rx="4" fill="url(#jar-label)" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Top & Bottom Floral Watercolor Garland Borders -->
    <!-- Top Floral Border -->
    <g transform="translate(200, 230) scale(0.55)">
      <circle cx="-60" cy="0" r="6" fill="#F497A9" opacity="0.85"/>
      <circle cx="-30" cy="0" r="7" fill="#E8788E" opacity="0.9"/>
      <circle cx="0" cy="0" r="8" fill="#F497A9" opacity="0.85"/>
      <circle cx="30" cy="0" r="7" fill="#E8788E" opacity="0.9"/>
      <circle cx="60" cy="0" r="6" fill="#F497A9" opacity="0.85"/>
      <!-- Leaves -->
      <path d="M-45,-4 Q-48,-10 -40,-8 Z" fill="#88A878"/>
      <path d="M-15,-4 Q-18,-10 -10,-8 Z" fill="#88A878"/>
      <path d="M15,-4 Q18,-10 10,-8 Z" fill="#88A878"/>
      <path d="M45,-4 Q48,-10 40,-8 Z" fill="#88A878"/>
    </g>

    <!-- Brand Calligraphy "Máximo" -->
    <text x="200" y="274" font-family="'Cormorant Garamond', 'Alex Brush', cursive, serif" font-size="28" font-style="italic" font-weight="600" fill="#24221F" text-anchor="middle" letter-spacing="1">Máximo</text>
    
    <!-- Product Name "Creme Acetinado" -->
    <text x="200" y="302" font-family="'Cormorant Garamond', 'Alex Brush', cursive, serif" font-size="19" font-style="italic" font-weight="500" fill="#A96227" text-anchor="middle" letter-spacing="0.5">Creme Acetinado</text>

    <!-- Net Weight "200g" -->
    <text x="200" y="322" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#24221F" text-anchor="middle" letter-spacing="1">200g</text>

    <!-- Bottom Floral Border -->
    <g transform="translate(200, 332) scale(0.55)">
      <circle cx="-50" cy="0" r="6" fill="#F497A9" opacity="0.85"/>
      <circle cx="-20" cy="0" r="7" fill="#E8788E" opacity="0.9"/>
      <circle cx="20" cy="0" r="7" fill="#E8788E" opacity="0.9"/>
      <circle cx="50" cy="0" r="6" fill="#F497A9" opacity="0.85"/>
      <path d="M-35,4 Q-38,10 -30,8 Z" fill="#88A878"/>
      <path d="M35,4 Q38,10 30,8 Z" fill="#88A878"/>
    </g>

    <!-- Glass/Porcelain Gloss Reflections -->
    <path d="M 120 205 L 132 205 L 128 350 L 118 350 Z" fill="#FFFFFF" fill-opacity="0.45"/>
    <path d="M 270 205 L 278 205 L 274 350 L 268 350 Z" fill="#FFFFFF" fill-opacity="0.25"/>
  </g>
</svg>
