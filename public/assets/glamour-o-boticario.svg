<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="gl-amber-liquid" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="35%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <linearGradient id="gl-gold-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="gl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#B45309" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#gl-shadow)">
    <!-- Satin Gold Sculpted Cap -->
    <rect x="175" y="50" width="50" height="40" rx="6" fill="url(#gl-gold-cap)" stroke="#78350F" stroke-width="1"/>
    <!-- Gold Ring Collar -->
    <rect x="180" y="90" width="40" height="15" fill="url(#gl-gold-cap)"/>

    <!-- Sinuous Feminine Hourglass Curved Glass Flacon -->
    <path d="M 150 105 C 130 140, 130 180, 160 250 C 120 330, 120 380, 150 420 L 250 420 C 280 380, 280 330, 240 250 C 270 180, 270 140, 250 105 Z" fill="url(#gl-amber-liquid)" stroke="#F59E0B" stroke-width="2"/>

    <!-- Solid Clear Crystal Base -->
    <rect x="150" y="410" width="100" height="18" rx="6" fill="#FFFFFF" fill-opacity="0.7"/>

    <!-- Typography -->
    <text x="200" y="240" font-family="'Cinzel', 'Playfair Display', serif" font-size="18" font-weight="bold" fill="#78350F" text-anchor="middle" letter-spacing="4">GLAMOUR</text>
    <text x="200" y="265" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="3">O BOTICÁRIO</text>
    <text x="200" y="285" font-family="'Inter', sans-serif" font-size="7" fill="#B45309" text-anchor="middle" letter-spacing="2">COLÔNIA · 75 ML</text>
  </g>
</svg>
