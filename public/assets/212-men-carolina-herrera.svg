<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ch-brushed-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="ch-inner-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#115E59" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="ch-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#ch-shadow)">
    <!-- Brushed Silver Cylindrical Top Cap -->
    <rect x="140" y="55" width="120" height="110" rx="20" fill="url(#ch-brushed-silver)" stroke="#64748B" stroke-width="1.5"/>
    <line x1="140" y1="165" x2="260" y2="165" stroke="#334155" stroke-width="1"/>

    <!-- Main Metallic Cylindrical Bottle Body -->
    <rect x="140" y="165" width="120" height="260" rx="20" fill="url(#ch-brushed-silver)" stroke="#64748B" stroke-width="2"/>

    <!-- Center Cutout / Recessed Glass Window for "212 MEN" -->
    <rect x="165" y="210" width="70" height="170" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <!-- Fresh Greenish Aquamarine Glass Glow -->
    <rect x="168" y="213" width="64" height="164" rx="8" fill="url(#ch-inner-glass)"/>

    <!-- Translucent NYC Typography Rotated / Vertical -->
    <text x="200" y="270" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">212</text>
    <text x="200" y="315" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">MEN</text>
    <text x="200" y="345" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#F0FDFA" text-anchor="middle" letter-spacing="2">NYC</text>

    <!-- Sub-branding at bottom -->
    <text x="200" y="405" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="2">CAROLINA HERRERA</text>

    <!-- Metallic Specular Light Line -->
    <line x1="160" y1="65" x2="160" y2="415" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.7"/>
    <line x1="164" y1="65" x2="164" y2="415" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.9"/>
  </g>
</svg>
