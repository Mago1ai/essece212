<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="fan-fuchsia" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="25%" stop-color="#F472B6"/>
      <stop offset="60%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#701A75"/>
    </radialGradient>
    <linearGradient id="fan-green-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="fan-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#DB2777" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#fan-shadow)">
    <!-- Top Cap Ball -->
    <circle cx="200" cy="80" r="22" fill="url(#fan-fuchsia)" stroke="#F472B6" stroke-width="1.5"/>
    <!-- Green Crystal Collar Neck Ring with Encrusted Rhinestones -->
    <rect x="180" y="102" width="40" height="20" rx="4" fill="url(#fan-green-ring)" stroke="#047857" stroke-width="1"/>
    <circle cx="188" cy="112" r="3" fill="#FFFFFF"/>
    <circle cx="200" cy="112" r="3" fill="#FFFFFF"/>
    <circle cx="212" cy="112" r="3" fill="#FFFFFF"/>

    <!-- Spherical Orb Flacon -->
    <circle cx="200" cy="265" r="130" fill="url(#fan-fuchsia)" stroke="#F472B6" stroke-width="2"/>

    <!-- Encrusted Green Swarovski Crystals scattered around orb -->
    <circle cx="140" cy="200" r="4.5" fill="#34D399" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="170" cy="170" r="4.5" fill="#34D399" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="235" cy="175" r="4.5" fill="#34D399" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="260" cy="220" r="4.5" fill="#34D399" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="250" cy="310" r="4.5" fill="#34D399" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="150" cy="320" r="4.5" fill="#34D399" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="190" cy="350" r="4.5" fill="#34D399" stroke="#FFFFFF" stroke-width="1"/>

    <!-- Orb Glass Light Shimmer -->
    <ellipse cx="160" cy="190" rx="35" ry="25" fill="#FFFFFF" fill-opacity="0.5" transform="rotate(-30, 160, 190)"/>

    <!-- Typography -->
    <text x="200" y="260" font-family="'Cinzel', 'Playfair Display', serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">FANTASY</text>
    <text x="200" y="285" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FDF2F8" text-anchor="middle" letter-spacing="2">BRITNEY SPEARS</text>
    <text x="200" y="305" font-family="'Inter', sans-serif" font-size="7" fill="#FCE7F3" text-anchor="middle" letter-spacing="1">EAU DE PARFUM · 100 ML</text>
  </g>
</svg>
