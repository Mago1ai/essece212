<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="lb-amber-liquid" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <linearGradient id="lb-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="lb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#78350F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#lb-shadow)">
    <!-- Asymmetrical Haute Couture Black Beveled Cap with Gold Cutout -->
    <!-- Geometric Black Cap -->
    <path d="M 160 55 L 245 45 L 245 105 L 160 115 Z" fill="#09090B" stroke="#27272A" stroke-width="1.5"/>
    <!-- Gold V-Cut Accent on Cap -->
    <polygon points="215,60 240,55 240,80" fill="url(#lb-gold)"/>

    <!-- Gold Chains Wrapping Neck -->
    <rect x="175" y="112" width="50" height="12" rx="2" fill="url(#lb-gold)"/>
    <line x1="175" y1="116" x2="225" y2="116" stroke="#FEF08A" stroke-width="1.5"/>
    <line x1="175" y1="120" x2="225" y2="120" stroke="#78350F" stroke-width="1.5"/>

    <!-- Heavy Architectural Clear Glass Flacon with Amber Fluid -->
    <rect x="125" y="125" width="150" height="285" rx="6" fill="url(#lb-amber-liquid)" stroke="#D97706" stroke-width="2"/>
    <rect x="127" y="380" width="146" height="28" rx="4" fill="#FFFFFF" fill-opacity="0.6"/>

    <!-- Giant Iconic Gold YSL Monogram Wrapped Around Glass Bottom Angle -->
    <g transform="translate(135, 230)">
      <!-- YSL Emblem Horizontal Bar with Pins -->
      <rect x="0" y="55" width="130" height="18" fill="url(#lb-gold)" stroke="#78350F" stroke-width="1"/>
      <circle cx="10" cy="64" r="3" fill="#FEF08A"/>
      <circle cx="120" cy="64" r="3" fill="#FEF08A"/>

      <!-- Vertical Interlocking Y-S-L Letters -->
      <!-- Y -->
      <path d="M 25 15 L 45 45 L 65 15 L 53 15 L 45 30 L 37 15 Z" fill="url(#lb-gold)"/>
      <rect x="42" y="40" width="7" height="35" fill="url(#lb-gold)"/>
      <!-- S -->
      <path d="M 50 15 C 65 15, 65 30, 50 40 C 35 50, 35 70, 60 70 L 60 62 C 45 62, 45 52, 60 42 C 75 32, 75 15, 50 15 Z" fill="url(#lb-gold)"/>
      <!-- L -->
      <path d="M 68 15 L 75 15 L 75 62 L 95 62 L 95 70 L 68 70 Z" fill="url(#lb-gold)"/>
    </g>

    <!-- Typography -->
    <text x="200" y="195" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="bold" fill="#09090B" text-anchor="middle" letter-spacing="8">LIBRE</text>
    <text x="200" y="215" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#27272A" text-anchor="middle" letter-spacing="3">EAU DE PARFUM</text>
  </g>
</svg>
